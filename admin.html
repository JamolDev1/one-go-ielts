<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard · One-Go IELTS</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script></head><body><div class="shell"><header class="topbar"><div class="brand-mark">OF</div><div><div class="eyebrow">PRIVATE AREA</div><h1>Teacher dashboard</h1></div><button id="logout" class="secondary" style="margin-left:auto">Sign out</button></header><main><section class="card"><p class="eyebrow">SUBMISSIONS</p><h2>Student results</h2><p class="muted">Only an account marked as an administrator can view this page. Export each student's answers and essays as a Word document.</p><p id="status" class="submission-status">Checking access…</p><div id="results" style="overflow:auto"></div></section></main><footer>Private assessment records</footer></div><script src="config.js"></script><script>
(async()=>{const cfg=window.EXAM_CONFIG||{};const $=id=>document.getElementById(id);if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('YOUR-PROJECT')||!window.supabase){$('status').textContent='Setup incomplete: configure config.js.';return;}const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data:{user},error:authErr}=await sb.auth.getUser();if(authErr||!user){location.href='index.html';return;}const {data:profile}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(profile?.role!=='admin'){$('status').textContent='Access denied. This page is for teacher accounts only.';return;}const {data,error}=await sb.from('exam_submissions').select('id,student_name,started_at,submitted_at,answers').order('submitted_at',{ascending:false});if(error){$('status').textContent='Could not load results: '+error.message;return;} $('status').textContent=(data.length+' submission(s)');const wrap=$('results');if(!data.length){wrap.textContent='No submissions yet.';return;}const table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse;font-size:13px';table.innerHTML='<thead><tr><th style="text-align:left;padding:12px;border-bottom:1px solid #e1e8e3">Student</th><th style="text-align:left;padding:12px;border-bottom:1px solid #e1e8e3">Submitted</th><th style="text-align:left;padding:12px;border-bottom:1px solid #e1e8e3">Action</th></tr></thead>';const body=document.createElement('tbody');data.forEach(row=>{const tr=document.createElement('tr');tr.innerHTML='<td style="padding:12px;border-bottom:1px solid #e1e8e3"></td><td style="padding:12px;border-bottom:1px solid #e1e8e3"></td><td style="padding:12px;border-bottom:1px solid #e1e8e3"></td>';tr.children[0].textContent=row.student_name||'Unnamed';tr.children[1].textContent=row.submitted_at?new Date(row.submitted_at).toLocaleString():'—';const b=document.createElement('button');b.className='primary';b.textContent='Download .docx';b.style.padding='9px 12px';b.onclick=()=>downloadDoc(row);tr.children[2].appendChild(b);body.appendChild(tr)});table.appendChild(body);wrap.appendChild(table);
async function downloadDoc(row){const {Document,Packer,Paragraph,TextRun,HeadingLevel}=docx;const a=row.answers||{};const children=[new Paragraph({text:'One-Go IELTS Exam Result',heading:HeadingLevel.TITLE}),new Paragraph({children:[new TextRun({text:'Student: ',bold:true}),new TextRun(row.student_name||'Unnamed')]}),new Paragraph({children:[new TextRun({text:'Submitted: ',bold:true}),new TextRun(row.submitted_at?new Date(row.submitted_at).toLocaleString():'—')]}),new Paragraph({text:'Listening',heading:HeadingLevel.HEADING_1})];appendAnswers(children,a.listening);children.push(new Paragraph({text:'Reading',heading:HeadingLevel.HEADING_1}));appendAnswers(children,a.reading);children.push(new Paragraph({text:'Writing Task 1',heading:HeadingLevel.HEADING_1}),new Paragraph({text:(a.writing?.task1||'No response').slice(0,30000)}),new Paragraph({text:'Writing Task 2',heading:HeadingLevel.HEADING_1}),new Paragraph({text:(a.writing?.task2||'No response').slice(0,30000)}));const doc=new Document({sections:[{children}]});const blob=await Packer.toBlob(doc);const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=(row.student_name||'student').replace(/[^a-z0-9_-]/gi,'_')+'_IELTS_result.docx';link.click();URL.revokeObjectURL(url)}function appendAnswers(children,obj){if(!obj||!Object.keys(obj).length){children.push(new Paragraph({text:'No answers captured.'}));return;}Object.keys(obj).sort((x,y)=>parseInt(x.replace(/\D/g,''))-parseInt(y.replace(/\D/g,''))).forEach(k=>children.push(new Paragraph({children:[new TextRun({text:k.toUpperCase()+': ',bold:true}),new TextRun(Array.isArray(obj[k])?obj[k].join(', '):String(obj[k]))]})))}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};})();</script></body></html>
